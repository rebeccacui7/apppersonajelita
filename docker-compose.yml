# 本地一键体验：docker compose up -d  然后访问 http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_DEBUG: "1"
      DB_HOST: db
      DB_DATABASE: oa_admin
      DB_USERNAME: oa
      DB_PASSWORD: oa_secret
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: oa_admin
      MYSQL_USER: oa
      MYSQL_PASSWORD: oa_secret
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/demo.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
